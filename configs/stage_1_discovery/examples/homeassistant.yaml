# Home Assistant Discovery Configuration
# This configuration defines the discovery settings for processing Home Assistant
# repositories and custom components (HACS).
#
# =============================================================================
# ADAPTER SELECTION BEHAVIOR
# =============================================================================
#
# The processor automatically selects the adapter based on file extension:
# - .py files → PythonAstAdapter (Python)
# - .ts files → TypeScriptAdapter (TypeScript)
# - .tsx files → TypeScriptAdapter (TypeScript)
# - .json files → TranslationJsonParser (JSON/i18n)
#
# IMPORTANT: DO NOT set 'profile' if you want automatic adapter selection.
# Setting 'profile: homeassistant' forces PythonAstAdapter for ALL files,
# which breaks TypeScript processing. Leave 'profile' commented out to
# allow the system to detect the adapter automatically based on file extension.
#
# =============================================================================

# Target subdirectory for discovered repositories
category: homeassistant

# Discovery mode: static (predefined repos) or dynamic (GitHub search)
mode: static

# Profile name for filtering and configuration
# WARNING: Do NOT set this value if you want automatic adapter selection.
# Setting profile: homeassistant forces PythonAstAdapter for ALL files.
# Leave commented to allow automatic detection based on file extension.
# profile: homeassistant

# Discovery strategy: auto-detect based on repo contents
# Supported strategies: auto, manifest, init, directory, typescript, manual_mapping
# module_discovery_strategy: auto

# File extensions to process during discovery (mapped to profile_extensions by processor)
extensions:
  - ".py"        # Python backend integrations
  - ".md"        # Documentation
  - ".ts"        # TypeScript frontend
  - ".tsx"       # TSX frontend components
  - ".json"      # i18n translations
  - ".yaml"      # YAML/blueprint files (blueprints, automations, themes)
  - ".yml"       # YAML files (alias for .yaml)
  - ".jinja"     # Jinja template files
  - ".jinja2"    # Jinja template files (alias for .jinja)

# Paths to ignore during discovery (mapped to profile_ignored_paths by processor)
ignore_patterns:
  - ".git"
  - "__pycache__"
  - "venv"
  - "node_modules"
  - ".tox"
  - "eggs"
  - ".pytest_cache"
  - "tests"
  - "test"
  - "dist"
  - "build"

# Static repositories to process (Home Assistant ecosystem)
# Core repos + popular custom components from HACS
static_repos:
  # === CORE REPOS ===
  - "home-assistant/home-assistant"    # Backend (Python)
  - "home-assistant/integration"       # Backend (Python)
  - "home-assistant/frontend"          # Frontend (TypeScript/TSX)
  - "home-assistant/supervisor"        # Backend (Python)
  - "home-assistant/architecture"      # Backend (Python)
  - "home-assistant/hass-cli"          # Backend (Python)
  - "home-assistant/core"              # Backend (Python)

  # === HACS INTEGRATIONS (Python) ===
  - "XiaoMi/ha_xiaomi_home"            # Xiaomi Home integration
  - "al-one/hass-xiaomi-miot"          # Xiaomi Miot integration
  - "rospogrigio/localtuya"            # Local Tuya integration
  - "AlexxIT/SonoffLAN"                # Sonoff LAN integration
  - "basnijholt/adaptive-lighting"     # Adaptive Lighting
  - "AlexxIT/XiaomiGateway3"           # Xiaomi Gateway 3
  - "custom-components/ble_monitor"    # BLE Monitor
  - "AlexxIT/WebRTC"                   # WebRTC Camera
  - "bieniu/ha-shellies-discovery"     # Shelly Discovery
  - "bieniu/ha-shellies-discovery-gen2" # Shelly Gen2 Discovery
  - "pmazz/ps_hassio_entities"         # Hassio Entities
  - "point-4ward/ps-date-countdown"    # Date Countdown
