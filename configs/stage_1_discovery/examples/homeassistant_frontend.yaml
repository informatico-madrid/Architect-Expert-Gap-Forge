# Home Assistant Frontend Discovery Configuration
# This configuration defines the discovery settings for processing the Home Assistant
# frontend repository (TypeScript/ Lit components).

# Target subdirectory for discovered repositories
category: homeassistant

# Discovery mode: static (predefined repos) or dynamic (GitHub search)
mode: static

# Profile: TypeScript adapter for .ts/.tsx files
profile: typescript

# File extensions to process (mapped to profile_extensions by processor)
extensions:
  - ".ts"
  - ".tsx"
  - ".json"

# Paths to ignore during discovery (mapped to profile_ignored_paths by processor)
ignore_patterns:
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".tox"
  - "test"
  - "tests"
  - "dist"
  - "build"
  - "*.spec.ts"
  - "*.test.ts"

# Static repositories to process (Home Assistant frontend)
static_repos:
  - "home-assistant/frontend"

# Minimum stars required for repositories
min_stars: 0

# Results per page for GitHub API requests
per_page: 100

# Base directory for output
base_dir: .

# Subdirectory for raw repository data
raw_subdir: data/raw

# Subdirectory where processor will write packaged bundles
output_subdir: data/raw/homeassistant_frontend_bundles