# Home Assistant Frontend Discovery Configuration
# This configuration defines the discovery settings for processing the Home Assistant
# frontend repository (TypeScript/ Lit components).
#
# =============================================================================
# ADAPTER SELECTION BEHAVIOR
# =============================================================================
#
# The processor automatically selects the adapter based on file extension:
# - .ts files → TypeScriptAdapter (TypeScript)
# - .tsx files → TypeScriptAdapter (TypeScript)
# - .json files → TranslationJsonParser (JSON/i18n)
#
# IMPORTANT: DO NOT set 'profile' if you want automatic adapter selection.
# Setting 'profile: typescript' forces TypeScriptAdapter for ALL files.
# Leave 'profile' commented out to allow the system to detect the adapter
# automatically based on file extension.
#
# =============================================================================
# MODULE DISCOVERY STRATEGY
# =============================================================================
#
# Discovery strategy: auto-detect based on repo contents
# The system will automatically choose:
# - 'manifest' strategy for Python HA repos (manifest.json + __init__.py)
# - 'init' strategy for Python packages (__init__.py only)
# - 'typescript' strategy for TypeScript/TSX repos (.ts/.tsx files)
# - 'filesystem' strategy for PHP repos (.php files, composer.json)
# - 'directory' strategy for Python repos without __init__.py
#
# Leave 'module_discovery_strategy' commented to allow auto-detection.
# =============================================================================

# Target subdirectory for discovered repositories
category: homeassistant

# Discovery mode: static (predefined repos) or dynamic (GitHub search)
mode: static

# Discovery strategy: auto-detect based on repo contents
# Leave module_discovery_strategy commented for auto-detection
# module_discovery_strategy: auto

# File extensions to process (mapped to profile_extensions by processor)
extensions:
  - ".ts"
  - ".tsx"
  - ".json"

# Paths to ignore during discovery (mapped to profile_ignored_paths by processor)
ignore_patterns:
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".tox"
  - "test"
  - "tests"
  - "dist"
  - "build"
  - "*.spec.ts"
  - "*.test.ts"

# Static repositories to process (Home Assistant frontend)
static_repos:
  - "home-assistant/frontend"

# Minimum stars required for repositories
min_stars: 0

# Results per page for GitHub API requests
per_page: 100

# Target profile for adapter selection (enables TypeScriptAdapter for .ts/.tsx)
profile: typescript

# Base directory for output
base_dir: .

# Subdirectory for raw repository data
raw_subdir: data/raw

# Subdirectory where processor will write packaged bundles
output_subdir: data/raw/homeassistant_frontend_bundles