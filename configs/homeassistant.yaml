# Home Assistant discovery config for RepoIngestor
# Use code search for integration manifests to surface low-star integrations
# (will require a GitHub token in the environment).
search_query: 'filename:manifest.json "homeassistant"'
min_stars: 0
limit: 300
category: homeassistant
mode: static
limit: 70
extensions:
  - ".py"
  - ".md"
  - ".jinja"
  - ".j2"
  - ".ts"
  - ".tsx"
MAX_SIZE_FRONTEND: 60_000
# Aquí está tu lista de "Oro":
