      # custom_components/multi_coordinator/coordinator_protocol.py
      """Protocol definition for coordinator abstraction."""
      from __future__ import annotations

      from collections.abc import Callable
      from typing import Any, Protocol, TypeGuard, runtime_checkable

      from homeassistant.core import CALLBACK_TYPE, callback


      @runtime_checkable
      class CoordinatorProtocol(Protocol):
          """Protocol for data update coordinators (no inheritance required)."""

          @property
          def data(self) -> Any:
              """Return coordinator data."""

          @callback
          def async_add_listener(
              self, update_callback: CALLBACK_TYPE, context: Any = None
          ) -> Callable[[], None]:
              """Register callback for updates."""

          @property
          def last_update_success(self) -> bool:
              """Return if last update succeeded."""


      def is_coordinator(obj: Any) -> TypeGuard[CoordinatorProtocol]:
          """Type guard for coordinator protocol compliance."""
          return isinstance(obj, CoordinatorProtocol)


      # custom_components/multi_coordinator/entity.py
      """Entity with multiple coordinators support."""
      from __future__ import annotations

      from collections.abc import Callable
      import logging
      from typing import Any

      from homeassistant.config_entries import ConfigEntry, current_entry
      from homeassistant.helpers import frame
      from homeassistant.helpers.entity import Entity
      from homeassistant.helpers.typing import UNDEFINED, UndefinedType

      from .coordinator_protocol import CoordinatorProtocol, is_coordinator

      _LOGGER = logging.getLogger(__name__)


      class MultiCoordinatorEntity(Entity):
          """Entity that subscribes to multiple coordinators."""

          def __init__(
              self,
              coordinators: dict[str, CoordinatorProtocol],
              *,
              config_entry: ConfigEntry | None | UndefinedType = UNDEFINED,
          ) -> None:
              """Initialize entity with multiple coordinators."""
              super().__init__()
              
              # Lazy config_entry resolution with deprecation warning
              if config_entry is UNDEFINED:
                  frame.report_usage(
                      "relies on ContextVar for config_entry, "
                      "but should pass it explicitly",
                      core_behavior=frame.ReportBehavior.ERROR,
                      custom_integration_behavior=frame.ReportBehavior.LOG,
                      breaks_in_ha_version="2026.8",
                  )
                  self._config_entry = current_entry.get()
              else:
                  self._config_entry = config_entry

              # Validate all coordinators implement Protocol
              for name, coordinator in coordinators.items():
                  if not is_coordinator(coordinator):
                      raise TypeError(
                          f"Coordinator '{name}' does not implement CoordinatorProtocol"
                      )

              self._coordinators = coordinators
              self._unsub_callbacks: dict[str, Callable[[], None]] = {}

          async def async_added_to_hass(self) -> None:
              """Subscribe to coordinator updates."""
              await super().async_added_to_hass()

              for name, coordinator in self._coordinators.items():
                  unsub = coordinator.async_add_listener(
                      self._handle_coordinator_update,
                      context=name,
                  )
                  self._unsub_callbacks[name] = unsub

          async def async_will_remove_from_hass(self) -> None:
              """Unsubscribe from coordinators."""
              for unsub in self._unsub_callbacks.values():
                  unsub()
              self._unsub_callbacks.clear()

              await super().async_will_remove_from_hass()

          @callback
          def _handle_coordinator_update(self, context: Any = None) -> None:
              """Handle coordinator update with context."""
              coordinator_name = context
              _LOGGER.debug(
                  "%s: Received update from coordinator '%s'",
                  self.entity_id,
                  coordinator_name,
              )
              self.async_write_ha_state()

          @property
          def available(self) -> bool:
              """Return if entity is available (all coordinators healthy)."""
              return all(
                  coord.last_update_success for coord in self._coordinators.values()
              )

          def get_coordinator_data(self, name: str) -> Any:
              """Get data from specific coordinator."""
              return self._coordinators[name].data


