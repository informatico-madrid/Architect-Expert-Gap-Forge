      """DataUpdateCoordinator for Xiaomi Fridge."""
      from __future__ import annotations

      from datetime import timedelta
      import logging
      from typing import TYPE_CHECKING, TypeVar

      from homeassistant.core import HomeAssistant
      from homeassistant.helpers.update_coordinator import DataUpdateCoordinator, UpdateFailed

      if TYPE_CHECKING:
          from .registry import FridgeRegistry

      _LOGGER = logging.getLogger(__name__)

      _DataT = TypeVar("_DataT", bound=dict)


      class FridgeDataUpdateCoordinator(DataUpdateCoordinator[_DataT]):
          """Coordinator for fridge sensor data."""

          def __init__(
              self,
              hass: HomeAssistant,
              registry: FridgeRegistry,
              device_id: str,
          ) -> None:
              """Initialize coordinator."""
              super().__init__(
                  hass,
                  _LOGGER,
                  name=f"Fridge {device_id}",
                  update_interval=timedelta(seconds=30),
              )
              self.registry = registry
              self.device_id = device_id

          async def _async_update_data(self) -> _DataT:
              """Fetch data from local or cloud."""
              # Try local first if available
              if self.registry.local.is_connected(self.device_id):
                  try:
                      return await self.registry.local.async_get_state(self.device_id)
                  except Exception as err:
                      _LOGGER.debug("Local fetch failed, trying cloud: %s", err)

              # Fallback to cloud
              if self.registry.cloud.authenticated:
                  try:
                      return await self.registry.cloud.async_get_device_state(self.device_id)
                  except CloudRateLimitError as err:
                      # Propagate retry_after to coordinator
                      raise UpdateFailed(
                          f"Cloud rate limit: {err}",
                          retry_after=err.retry_after,
                      ) from err
                  except Exception as err:
                      raise UpdateFailed(f"Cloud error: {err}") from err

              raise UpdateFailed("Device unreachable (local and cloud unavailable)")


