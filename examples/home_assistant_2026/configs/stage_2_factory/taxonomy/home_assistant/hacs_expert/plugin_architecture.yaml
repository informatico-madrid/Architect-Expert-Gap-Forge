      # custom_components/govee_thermo/coordinator.py
      """Active Bluetooth coordinator for Govee thermometers."""
      from __future__ import annotations

      from dataclasses import dataclass
      from datetime import timedelta
      import logging
      from typing import Any

      from bleak import BleakClient, BleakError
      from bluetooth_data_tools import monotonic_time_coarse

      from homeassistant.components.bluetooth import (
          BluetoothScanningMode,
          BluetoothServiceInfoBleak,
      )
      from homeassistant.components.bluetooth.active_update_coordinator import (
          ActiveBluetoothDataUpdateCoordinator,
      )
      from homeassistant.core import HomeAssistant

      _LOGGER = logging.getLogger(__name__)

      BATTERY_CHAR_UUID = "00002a19-0000-1000-8000-00805f9b34fb"
      POLL_INTERVAL = 60  # seconds


      @dataclass
      class GoveeData:
          """Data from Govee thermometer."""

          temperature: float
          humidity: float
          battery: int | None = None
          rssi: int = -127


      class GoveeActiveCoordinator(ActiveBluetoothDataUpdateCoordinator[GoveeData]):
          """Coordinator for Govee H5075 thermometer."""

          def __init__(
              self,
              hass: HomeAssistant,
              logger: logging.Logger,
              address: str,
          ) -> None:
              """Initialize coordinator."""
              super().__init__(
                  hass=hass,
                  logger=logger,
                  address=address,
                  mode=BluetoothScanningMode.ACTIVE,
                  needs_poll_method=self._needs_poll,
                  poll_method=self._async_poll_battery,
                  connectable=True,
              )
              self._last_advertisement_data = GoveeData(0.0, 0.0)

          def _needs_poll(
              self,
              service_info: BluetoothServiceInfoBleak,
              seconds_since_last_poll: float | None,
          ) -> bool:
              """Determine if battery poll is needed."""
              if self.hass.is_stopping:
                  return False
              # Poll every 60s or if never polled
              return seconds_since_last_poll is None or seconds_since_last_poll >= POLL_INTERVAL

          async def _async_poll_battery(
              self, service_info: BluetoothServiceInfoBleak
          ) -> GoveeData:
              """Poll battery level via GATT."""
              async with BleakClient(service_info.device) as client:
                  battery_bytes = await client.read_gatt_char(BATTERY_CHAR_UUID)
                  battery = int.from_bytes(battery_bytes, byteorder="little")

              # Merge with last advertisement data
              return GoveeData(
                  temperature=self._last_advertisement_data.temperature,
                  humidity=self._last_advertisement_data.humidity,
                  battery=battery,
                  rssi=service_info.rssi,
              )

          def _async_handle_bluetooth_event(
              self,
              service_info: BluetoothServiceInfoBleak,
              change: BluetoothChange,
          ) -> None:
              """Handle Bluetooth advertisement."""
              # Parse Govee H5075 advertisement (manufacturer_data key 0x0001)
              mfr_data = service_info.manufacturer_data.get(0x0001, b"")
              if len(mfr_data) >= 6:
                  temp_raw = int.from_bytes(mfr_data[3:5], byteorder="big", signed=True)
                  hum_raw = int.from_bytes(mfr_data[5:7], byteorder="big", signed=False)
                  
                  self._last_advertisement_data = GoveeData(
                      temperature=temp_raw / 100.0,
                      humidity=hum_raw / 100.0,
                      rssi=service_info.rssi,
                  )

                  # Merge with existing battery if available
                  if self.data and self.data.battery is not None:
                      self._last_advertisement_data.battery = self.data.battery

                  self.data = self._last_advertisement_data

              super()._async_handle_bluetooth_event(service_info, change)


