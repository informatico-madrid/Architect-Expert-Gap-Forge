      # custom_components/api_integration/coordinator.py
      """Generic paginated REST API coordinator with circuit breaker."""
      from __future__ import annotations

      from collections.abc import Awaitable, Callable
      from dataclasses import dataclass
      from datetime import datetime, timedelta
      from http import HTTPStatus
      import logging
      from typing import Any, Generic, Protocol, TypeVar

      import aiohttp
      from propcache.api import cached_property

      from homeassistant.core import HomeAssistant
      from homeassistant.helpers.update_coordinator import DataUpdateCoordinator, UpdateFailed

      _LOGGER = logging.getLogger(__name__)

      _DataT = TypeVar("_DataT", default=dict[str, Any])


      class APIClientProtocol(Protocol):
          """Protocol for REST API clients."""

          async def async_get(
              self, endpoint: str, params: dict[str, Any] | None = None
          ) -> dict[str, Any]:
              """Fetch data from API endpoint."""


      @dataclass
      class CircuitBreakerState:
          """Circuit breaker state tracking."""

          consecutive_failures: int = 0
          opened_at: datetime | None = None
          half_open_at: datetime | None = None
          
          @cached_property
          def is_open(self) -> bool:
              """Check if circuit is open (blocking requests)."""
              if self.opened_at is None:
                  return False
              
              # Auto-transition to half-open after cooldown
              cooldown = timedelta(seconds=2 ** self.consecutive_failures)
              if datetime.utcnow() - self.opened_at > cooldown:
                  self.half_open_at = datetime.utcnow()
                  return False
              
              return True


      class PaginatedAPICoordinator(DataUpdateCoordinator[list[_DataT]], Generic[_DataT]):
          """Coordinator with pagination, rate-limit, and circuit breaker."""

          def __init__(
              self,
              hass: HomeAssistant,
              client: APIClientProtocol,
              endpoint: str,
              *,
              name: str,
              update_interval: timedelta,
              page_size: int = 100,
          ) -> None:
              """Initialize coordinator."""
              super().__init__(
                  hass,
                  _LOGGER,
                  name=name,
                  update_interval=update_interval,
                  update_method=self._async_fetch_all_pages,
              )
              self._client = client
              self._endpoint = endpoint
              self._page_size = page_size
              self._circuit_breaker = CircuitBreakerState()

          async def _async_fetch_all_pages(self) -> list[_DataT]:
              """Fetch all pages from paginated API."""
              if self._circuit_breaker.is_open:
                  raise UpdateFailed("Circuit breaker open, skipping request")

              all_data: list[_DataT] = []
              page = 1

              try:
                  while True:
                      params = {"page": page, "per_page": self._page_size}
                      
                      try:
                          response = await self._client.async_get(self._endpoint, params)
                      except aiohttp.ClientResponseError as err:
                          if err.status == HTTPStatus.TOO_MANY_REQUESTS:
                              # Extract Retry-After header (seconds or datetime)
                              retry_after = err.headers.get("Retry-After", "60")
                              try:
                                  retry_seconds = int(retry_after)
                              except ValueError:
                                  # HTTP-date format, default to 60s
                                  retry_seconds = 60
                              
                              raise UpdateFailed(
                                  f"Rate limit exceeded: retry after {retry_seconds}s",
                                  retry_after=retry_seconds,
                              ) from err
                          raise UpdateFailed(f"HTTP {err.status}: {err.message}") from err

                      # Accumulate page data
                      page_data: list[_DataT] = response.get("data", [])
                      all_data.extend(page_data)

                      # Check for next page
                      next_url = response.get("pagination", {}).get("next")
                      if not next_url:
                          break

                      page += 1

                  # Success: reset circuit breaker
                  self._circuit_breaker.consecutive_failures = 0
                  self._circuit_breaker.opened_at = None
                  
                  return all_data

              except UpdateFailed:
                  # Increment failure counter and potentially open circuit
                  self._circuit_breaker.consecutive_failures += 1
                  if self._circuit_breaker.consecutive_failures >= 3:
                      self._circuit_breaker.opened_at = datetime.utcnow()
                      _LOGGER.warning(
                          "%s: Circuit breaker opened after %d failures",
                          self.name,
                          self._circuit_breaker.consecutive_failures,
                      )
                  raise


