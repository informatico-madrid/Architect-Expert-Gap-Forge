      # custom_components/xiaomi_fridge/__init__.py
      """Xiaomi Smart Fridge integration (LAN + Cloud)."""
      from __future__ import annotations

      import asyncio
      import logging
      from typing import Protocol

      from homeassistant.components import zeroconf
      from homeassistant.config_entries import ConfigEntry
      from homeassistant.const import EVENT_HOMEASSISTANT_STOP, Platform
      from homeassistant.core import HomeAssistant
      from homeassistant.exceptions import ConfigEntryAuthFailed, ConfigEntryNotReady
      from homeassistant.helpers.aiohttp_client import async_get_clientsession
      from homeassistant.helpers.storage import Store

      from .const import DOMAIN, SIGNAL_ADD_ENTITIES
      from .coordinator import FridgeDataUpdateCoordinator
      from .registry import FridgeRegistry

      _LOGGER = logging.getLogger(__name__)

      PLATFORMS: list[Platform] = [Platform.SENSOR, Platform.BINARY_SENSOR, Platform.SWITCH]


      async def async_setup_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:
          """Set up Xiaomi Fridge from config entry."""
          mode = entry.options.get("mode", "auto")  # auto, cloud, local
          
          session = async_get_clientsession(hass)
          hass.data.setdefault(DOMAIN, {})
          registry = hass.data[DOMAIN][entry.entry_id] = FridgeRegistry(hass, session)

          # OAuth2 cloud authentication (if configured)
          if not registry.cloud.authenticated and entry.data.get("token"):
              try:
                  await registry.cloud.async_authenticate(entry.data["token"])
                  # Update refresh token if rotated
                  if registry.cloud.token_updated:
                      hass.config_entries.async_update_entry(
                          entry,
                          data={**entry.data, "token": registry.cloud.token},
                      )
              except AuthError as err:
                  _LOGGER.warning("OAuth2 authentication failed: %s", err)
                  if mode == "cloud":
                      raise ConfigEntryAuthFailed(err) from err
              except Exception as err:
                  _LOGGER.error("Unexpected cloud error: %s", err)
                  if mode == "cloud":
                      raise ConfigEntryNotReady(err) from err

          entry.async_on_unload(
              hass.bus.async_listen_once(EVENT_HOMEASSISTANT_STOP, registry.async_stop)
          )

          # Forward setup BEFORE loading devices (for entity platform registration)
          await hass.config_entries.async_forward_entry_setups(entry, PLATFORMS)

          devices: list[dict] | None = None
          store = Store(hass, 1, f"{DOMAIN}/{entry.entry_id}.json")

          # Load devices from cloud API
          if registry.cloud.authenticated:
              try:
                  devices = await registry.cloud.async_get_fridges()
                  _LOGGER.debug("Loaded %d devices from cloud", len(devices))
                  await store.async_save(devices)
              except Exception as err:
                  _LOGGER.warning("Failed to load devices from cloud: %s", err)

          # Fallback to cache if cloud unavailable
          if not devices:
              if devices := await store.async_load():
                  _LOGGER.debug("Loaded %d devices from cache", len(devices))

          if not devices and mode != "local":
              raise ConfigEntryNotReady("No devices available and cache is empty")

          # Setup coordinators for each device
          if devices:
              coordinators = registry.setup_coordinators(devices)
          else:
              coordinators = []

          # Start cloud websocket (if authenticated)
          if mode in ("auto", "cloud") and registry.cloud.authenticated:
              await registry.cloud.async_start_websocket()

          # Start local mDNS discovery (if enabled)
          if mode in ("auto", "local"):
              zc_instance = await zeroconf.async_get_instance(hass)
              await registry.local.async_start(zc_instance)

          # Wait for initial connection before adding entities
          if registry.cloud.websocket_task:
              try:
                  await asyncio.wait_for(
                      registry.cloud.wait_connected(),
                      timeout=10.0,
                  )
              except asyncio.TimeoutError:
                  _LOGGER.warning("Cloud connection timeout, continuing with local")
          elif registry.local.discovered:
              await asyncio.sleep(3)  # Allow mDNS to discover devices

          # Trigger entity creation via dispatcher
          if coordinators:
              _LOGGER.debug("Adding %d coordinators", len(coordinators))
              for coordinator in coordinators:
                  await coordinator.async_config_entry_first_refresh()
              registry.dispatcher_send(SIGNAL_ADD_ENTITIES, coordinators)

          return True


      async def async_unload_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:
          """Unload Xiaomi Fridge config entry."""
          unload_ok = await hass.config_entries.async_unload_platforms(entry, PLATFORMS)
          
          if unload_ok:
              registry: FridgeRegistry = hass.data[DOMAIN].pop(entry.entry_id)
              await registry.async_stop()

          return unload_ok


