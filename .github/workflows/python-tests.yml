# SPDX-License-Identifier: Apache-2.0
# AEGF — Continuous Integration: Tests & Coverage
#
# Triggers on every push and pull_request targeting main.
# Fails if coverage of tracked modules (src/audit, src/utils) drops below 95 %.

name: Python Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          # If repository contains a nested 'data_factory' folder (local multi-project
          # workspace), run from there; otherwise run at repo root.
          if [ -d data_factory ]; then cd data_factory; fi
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # make coverage delegates to pytest with --cov-fail-under=95.
        # GOOGLE_API_KEY is intentionally empty: GeminiClient integration tests
        # that require a real key are skipped automatically; mock-based unit
        # tests run without a key and provide full coverage.
        run: |
          # Run tests from nested folder if present, otherwise from repo root.
          if [ -d data_factory ]; then cd data_factory; fi
          make coverage PYTHON=python
        env:
          GOOGLE_API_KEY: ""
          PYTHONPATH: .
          # Prevent python-dotenv from auto-loading .env files during CI test runs.
          # This avoids test flakiness caused by repo-local .env values (AEGF_DOC_*)
          # that alter document resolution in unit tests.
          PYTHON_DOTENV_DISABLED: '1'

      - name: Upload coverage report (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          # Accept the coverage artifact either at repo root or inside a nested
          # 'data_factory' folder so the workflow works for both repository layouts.
          path: |
            data_factory/coverage.xml
            coverage.xml
          if-no-files-found: warn
