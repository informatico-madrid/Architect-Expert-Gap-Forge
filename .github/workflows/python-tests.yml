# SPDX-License-Identifier: Apache-2.0
# AEGF — Continuous Integration: Tests & Coverage
#
# Triggers on every push and pull_request targeting main.
# Fails if coverage of tracked modules (src/audit, src/utils) drops below 95 %.

name: Python Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Prepare CI test mocks
        # Create deterministic mock config files used by unit/integration tests
        # instead of relying on developer-local files. These mocks replicate the
        # minimal keys tests expect (master_docs, master_docs_formatting, prompts).
        run: |
          set -euo pipefail
          mkdir -p configs/stage_5_evaluation

          cat > configs/stage_5_evaluation/eval_config.yaml <<'YAML'
          # Minimal mock eval_config for CI tests
          api_url: "http://localhost:8000/v1"
          audit_dir: "data/audit"
          gap_dir: "data/Gap"

          # Master docs filenames used by test fixtures
          master_docs:
            master_guide: "HA_MASTER_GUIDE_2026.md"
            technical_changelog: "technical_changelog_2026.md"
            jinja_yaml_guide: "HA_JINJA_YAML_GUIDE_2026.md"

          # Ensure formatting labels so tests that assert for 'MASTER_GUIDE' pass
          master_docs_formatting:
            master_guide:
              label: "MASTER_GUIDE"
              truncate_at: 8000
            technical_changelog:
              label: "TECHNICAL_CHANGELOG"
              truncate_at: 8000
            jinja_yaml_guide:
              label: "JINJA_YAML_GUIDE"
              truncate_at: 4000
          YAML

          cat > configs/stage_5_evaluation/eval_prompts.yaml <<'YAML'
          professor_exam:
            system: |
              You are a test professor model.
            user: |
              Generate an exam question for {fragment_name}

          professor_judge:
            system: |
              You are a test judge model.
            user: |
              Score responses for {exam_question}

          gap_analysis:
            system: |
              You are a test gap analyst.
            user: |
              Produce a concise gap analysis for {fragment_name}
          YAML

          cat > configs/stage_5_evaluation/ha_patterns.yaml <<'YAML'
          default_standards: |
            MASTER_GUIDE
          YAML

      - name: Run tests with coverage
        # make coverage delegates to pytest with --cov-fail-under=95.
        # GOOGLE_API_KEY is intentionally empty: GeminiClient integration tests
        # that require a real key are skipped automatically; mock-based unit
        # tests run without a key and provide full coverage.
        run: make coverage PYTHON=python
        env:
          GOOGLE_API_KEY: ""
          PYTHONPATH: .
          # Prevent python-dotenv from auto-loading .env files during CI test runs.
          # This avoids test flakiness caused by repo-local .env values (AEGF_DOC_*)
          # that alter document resolution in unit tests.
          PYTHON_DOTENV_DISABLED: '1'
          # Ensure doc_loader resolves the filenames created by pytest fixtures
          # when configs/stage_5_evaluation/eval_config.yaml is not present.
          AEGF_DOC_1: "HA_MASTER_GUIDE_2026.md"
          AEGF_DOC_2: "technical_changelog_2026.md"
          AEGF_DOC_3: "HA_JINJA_YAML_GUIDE_2026.md"

      - name: Upload coverage report (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
