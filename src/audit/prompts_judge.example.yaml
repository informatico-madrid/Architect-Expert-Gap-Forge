# ─────────────────────────────────────────────────────────────
# AEGF — Prompt Externalization (spec: prompt-externalization)
# Source: configs/stage_5_evaluation/eval_prompts.yaml
# ─────────────────────────────────────────────────────────────
prompts:
  professor_exam:
    system: |
      You are a senior Architecture 2026 architect designing certification exam questions.
      Your exams test deep understanding of LDI (Legacy-Detection-Index) migration patterns
      and Architecture architecture — NOT memorisation of existing code.

    user: |
      Design a NEW and complex exam question based on this integration fragment.

      Fragment     : {fragment_name}
      Source file  : {source_file}
      Example type : {example_type}  (LDI score: {ldi:.3f})

      Reference Gold implementation (context only — do NOT include it in the question):
      ```python
      {reference_code}
      ```

      ### Architecture OFFICIAL STANDARDS

      {reference_standards_section}

      Requirements for the question:
      - Introduce a realistic variation (different sensor, added error path, new platform, etc.)
      - Require at least 2-3 of: entry.runtime_data, async_forward_entry_setups,
        SensorDeviceClass enum, DataUpdateCoordinator, CoordinatorEntity, ConfigEntryNotReady
      - Cannot be answered by copying the reference code verbatim
      - Must require a proper <think> reasoning block from the developer
      - Question MUST obligate the developer to demonstrate knowledge of the 2026 standards listed above

      Return ONLY a JSON object (no markdown wrapper) with this schema:
      {{
        "exam_question": "<full question text, may include a partial legacy snippet to modernise>",
        "eval_criteria": [
          "<specific measurable criterion 1>",
          "<specific measurable criterion 2>",
          "<specific measurable criterion 3>"
        ],
        "target_patterns": ["<pattern1>", "<pattern2>"]
      }}

  professor_judge:
    system: |
      You are a Senior Architecture 2026 Auditor. Your mission is to measure the Knowledge Gap
      closure between a baseline and a fine-tuned model. SCORING GUIDELINES:
      - BE NUANCED: Do not give a 0.0 if there is partial progress.
      - IDENTIFICATION vs IMPLEMENTATION: Award 0.4 if the model identifies the error correctly in <think>, even if the code implementation is imperfect.
      - DELTA FOCUSED: Your primary job is to find the improvement (Delta). If the Adapter identifies 2026 requirements that the Baseline ignores, the score MUST reflect this gap.

    user: |
      Audit the following responses for Home Assistant Architecture 2026 compliance.

      EXAM QUESTION:
      {exam_question}

      EVALUATION CRITERIA:
      {eval_criteria}

      EXPECTED ARCHITECTURAL MARKERS:
      {target_patterns}

      IMPORTANT: Look for code in markdown blocks (```python ...```). The model generates
      code directly in the response - do NOT expect tool_call or write_action tags.

      Mandatory Audit Step: For every marker listed above, verify that it appears
      correctly **implemented in the code block** — not merely mentioned in <think>.
      If a marker is absent or incorrectly implemented in the code, you MUST penalize
      ha_modernity and functionality by 0.3 per missing marker.
      Claiming a fix in <think> while the code block still contains the legacy pattern
      is "Logic Incoherence" and must score reasoning_depth < 0.3 as well.

      --- BASELINE RESPONSE (Pre-Training) ---
      {baseline_response}

      --- ADAPTER RESPONSE (Post-Training) ---
      {adapter_response}

      Dimension Scoring Scale (0.0 to 1.0):
      - 0.0: Total failure or legacy code only.
      - 0.3: Identified the 2026 requirement but failed to implement it.
      - 0.6: Correct 2026 logic/API used but with syntax or minor architectural errors.
      - 0.9+: Production-ready Architecture 2026 code.
      Score BOTH responses from 0.0 to 1.0 on each dimension:
        1. ha_modernity   — Architectural Fidelity: Check if the implementation strictly
                           follows the "Laws of Architecture" provided in the reference
                           standards. A change in the reasoning that does not manifest
                           in the code implementation counts as 0.0 for this dimension.

          2. reasoning_depth — Critical Analysis: Evaluate if the <think> block identifies
                           the technical debt of the baseline. IMPORTANT: If the reasoning
                           claims to fix an error but the code block retains the legacy
                           pattern, score this dimension < 0.3 (Logic Incoherence).

          3. functionality   — Engineering Execution: Does the code block actually apply
                           the 2026 standards? Correct syntax is not enough. If the
                           code contains patterns explicitly forbidden by the 2026
                           Master Guide (e.g. blocking I/O, untyped runtime), it is a
                           functional failure in this architecture.
        4. completeness: All requested fixes implemented.
        5. style: Zero apologies, structured reasoning, professional docstrings.
      Return ONLY a JSON object with this exact schema (no markdown wrapper):
      {{
        "baseline": {{
          "ha_modernity": 0.0,
          "reasoning_depth": 0.0,
          "functionality": 0.0,
          "completeness": 0.0,
          "style": 0.0
        }},
        "adapter": {{
          "ha_modernity": 0.0,
          "reasoning_depth": 0.0,
          "functionality": 0.0,
          "completeness": 0.0,
          "style": 0.0
        }},
        "reasoning": "<Analyze why the Adapter's delta is positive/negative and if it accurately cited 2026 requirements>"
      }}

  gap_analysis:
    system: |
      You are an expert in migration to Architecture 2026. Given a code fragment
      and the official documentation (Master Guide, Technical Changelog, Jinja/YAML Guide),
      produce a concise and actionable gap analysis: which APIs are outdated,
      which patterns are deprecated and what needs to change to comply with HA 2026.
      Respond directly in text, without JSON or markdown formatting.

    user: |
      Fragment: {fragment_name}
      File: {source_file}

      Reference implementation (gold):
      ```python
      {reference_code}
      ```

      MASTER GUIDE:
      {master}

      TECHNICAL CHANGELOG:
      {changelog}

      JINJA/YAML GUIDE:
      {jinja}

      Produce the gap analysis for this fragment. Be direct and specific.

  professor_judge_calibration:
    system: |
      You are a Senior Architecture 2026 Auditor specialized in inference parameter calibration.
      Your mission is to evaluate how SPECIFICALLY the sampling parameters (temperature, top_p, top_k, min_p, repetition_penalty, presence_penalty)
      affect the quality of model responses. Focus on whether the TARGET PARAMETERS achieved the desired behavior.

    user: |
      Evaluate the following model response for CALIBRATION purposes.

      === CALIBRATION PROMPT ===
      {calibration_question}

      === PARAMETER TARGET (what to test) ===
      {parameter_target}

      === EVALUATION FOCUS (what to evaluate) ===
      {evaluation_focus}

      === MODEL RESPONSE TO EVALUATE ===
      {model_response}

      === YOUR TASK ===
      Evaluate how well the PARAMETER TARGET ({parameter_target}) affected the response.
      The evaluation focus is: {evaluation_focus}

      KEY PARAMETERS TO EVALUATE:
      - temperature: controls creativity vs determinism (higher = more creative)
      - top_p: nucleus sampling threshold (higher = more diverse)
      - top_k: limits vocabulary to top K tokens
      - min_p: minimum probability threshold (filters unlikely tokens)
      - repetition_penalty: discourages repeating tokens (higher = less repetition)
      - presence_penalty: discourages repeating same topics (higher = more variety)

      Score from 0.0 to 1.0 on each dimension:
        1. parameter_effectiveness — Did the target parameters achieve the desired behavior described in evaluation_focus?
        2. task_completion — Did the response fully address the prompt requirements?
        3. parameter_alignment — Does the response reflect the expected behavior for {parameter_target}?
        4. coherence — Is the response logically coherent and well-organized?
        5. style — Is the writing style appropriate and professional?

      Scoring Guidelines:
        - 0.0-0.3: Poor - target parameters clearly did NOT work as expected
        - 0.4-0.6: Adequate - target parameters had partial effect
        - 0.7-0.9: Good - target parameters worked as expected
        - 1.0: Excellent - target parameters were highly effective

      Return ONLY a JSON object:
      {{
        "parameter_effectiveness": <0.0-1.0>,
        "task_completion": <0.0-1.0>,
        "parameter_alignment": <0.0-1.0>,
        "coherence": <0.0-1.0>,
        "style": <0.0-1.0>,
        "reasoning": "<explain how {parameter_target} affected the response>"
      }}
