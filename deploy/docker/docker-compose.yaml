services:
  # --- BASE TEMPLATE (Avoid repeating configuration) ---
  x-axolotl-base: &axolotl-base
    image: ${AXOLOTL_IMAGE}
    user: "${USER_ID}:${GROUP_ID}"
    ipc: host
    shm_size: ${AEGF_SHM_SIZE}
    cpuset: ${CPU_SET}
    volumes:
      - ${AEGF_PROJECT_ROOT}:/workspace/data_factory
      - ${AEGF_MODELS_DIR}:/models_dir
      - ${AEGF_HF_CACHE}:/root/.cache/huggingface
    environment:
      - PYTHONPATH=/workspace/axolotl
      - AXOLOTL_DO_NOT_TRACK=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - WANDB_API_KEY=${AEGF_WANDB_API_KEY}
    deploy:
      resources:
        limits:
          cpus: ${AEGF_CPU_LIMIT}
          memory: ${AEGF_RAM_SWAP_LIMIT}
        reservations:
          devices:
            - driver: nvidia
              count: ${AEGF_GPUS}
              capabilities: [gpu]
    stdin_open: true
    tty: true
    working_dir: /workspace

  # --- TRAINING SERVICE ---
  trainer:
    <<: *axolotl-base
    container_name: aegf_trainer
    privileged: true
    ulimits:
      memlock: -1
      stack: ${AEGF_ULIMIT_MEMORY_STACK}
    command: >
      bash -c "
      apt-get update && 
      export PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True" &&
      export OMP_NUM_THREADS=${AEGF_CPU_LIMIT} &&
      export MKL_NUM_THREADS=${AEGF_CPU_LIMIT} &&
      accelerate launch 
      --num_processes=2 
      --num_machines=1 
      --mixed_precision=bf16 
      -m axolotl.cli.train /workspace/data_factory/configs/stage_4_training/axolotl/config.yaml &&
      sleep infinity
      "

  # --- PREPROCESSING SERVICE ---
  preprocessor:
    <<: *axolotl-base
    container_name: aegf_preprocessor
    image: axolotlai/axolotl:main-latest
    user: "0:0"
    command: >
      bash -c "python3 -m axolotl.cli.preprocess /workspace/data_factory/configs/stage_4_training/axolotl/config.yaml --debug"
  
  # --- INFERENCE SERVICE ---
  inference_station:
    <<: *axolotl-base
    container_name: aegf_inference
    command: >
      bash -c "python3 -m axolotl.cli.inference /workspace/data_factory/configs/inference/config_infer.yaml"

  # --- NEMO CURATOR SERVICE (STAGE 3) ---
  curator:
    build:
      context: .
      dockerfile: Dockerfile.curator
    image: nemo-curator-aegf:latest
    container_name: aegf_curator
    # Expose Ray dashboard on the host (port 8265)
    ports:
      - "8265:8265"
    environment:
      - RAY_DASHBOARD_HOST=0.0.0.0
    volumes:
      - ${AEGF_PROJECT_ROOT}:/workspace
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- MERGE SERVICE (Model weights consolidation) ---
  merger:
    <<: *axolotl-base
    container_name: aegf_merger
    # Use user 0:0 to avoid permission issues when writing the final model
    user: "0:0"
    environment:
      - AEGF_MERGE_CHECKPOINT=${AEGF_MERGE_CHECKPOINT:-final}
    command: >
      bash -c "
      CUDA_VISIBLE_DEVICES="" python3 -m axolotl.cli.merge_lora \
      /workspace/data_factory/${AEGF_CONFIG_PATH} \
      --lora_model_dir=${AEGF_CHECKPOINT_PATH}
      "
  quantizer:
    <<: *axolotl-base
    container_name: aegf_quantizer
    user: "0:0"
    command: >
      bash -c "
      echo 'Instalando llmcompressor...' &&
      pip install llmcompressor &&
      echo 'Iniciando cuantización FP8...' &&
      python3 /workspace/data_factory/src/quantizer/quantize_fp8.py
      "