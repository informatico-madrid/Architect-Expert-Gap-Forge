services:
  # --- BASE TEMPLATE (Para no repetir configuración) ---
  x-axolotl-base: &axolotl-base
    image: ${AXOLOTL_IMAGE}
    user: "${USER_ID}:${GROUP_ID}"
    privileged: true
    ipc: host
    shm_size: ${AEGF_SHM_SIZE}
    cpuset: ${CPU_SET}
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${AEGF_PROJECT_ROOT}:/workspace/data_factory
      - ${AEGF_MODELS_DIR}:/models_dir
      - ${AEGF_HF_CACHE}:/root/.cache/huggingface
    environment:
      - PYTHONPATH=/workspace/axolotl
      - AXOLOTL_DO_NOT_TRACK=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - WANDB_API_KEY=${AEGF_WANDB_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${AEGF_GPUS}
              capabilities: [gpu]
    stdin_open: true
    tty: true
    working_dir: /workspace

  # --- SERVICIO DE ENTRENAMIENTO ---
  trainer:
    <<: *axolotl-base
    container_name: aegf_trainer
    command: >
      bash -c "
      apt-get update && 
      export PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True" &&
      accelerate launch 
      --num_processes=2 
      --num_machines=1 
      --mixed_precision=bf16 
      -m axolotl.cli.train /workspace/data_factory/configs/stage_4_training/axolotl/config.yaml &&
      sleep infinity
      "services:

  # --- SERVICIO DE PREPROCESADO ---
  preprocessor:
    <<: *axolotl-base
    container_name: aegf_preprocessor
    image: axolotlai/axolotl:main-latest
    user: "0:0"
    command: >
      bash -c "python3 -m axolotl.cli.preprocess /workspace/data_factory/configs/stage_4_training/axolotl/config.yaml --debug"
  
  # --- SERVICIO DE INFERENCIA ---
  inference_station:
    <<: *axolotl-base
    container_name: aegf_inference
    command: >
      bash -c "python3 -m axolotl.cli.inference /workspace/data_factory/configs/inference/config_infer.yaml"

  # --- SERVICIO NEMO CURATOR (STAGE 3) ---
  curator:
    build:
      context: .
      dockerfile: Dockerfile.curator
    image: nemo-curator-aegf:latest
    container_name: aegf_curator
    # Exponer dashboard Ray en el host (puerto 8265)
    ports:
      - "8265:8265"
    environment:
      - RAY_DASHBOARD_HOST=0.0.0.0
    volumes:
      - ${AEGF_PROJECT_ROOT}:/workspace
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]